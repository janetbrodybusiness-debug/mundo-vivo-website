<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#00192d">
  <meta name="description" content="Mundo Vivo — Worlds Beyond Imagination">
  <title>Mundo Vivo — Worlds Beyond Imagination</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell" id="top">
    <div class="reference-stage" id="referenceStage">
      <img
        class="landing-reference"
        src="data:image/webp;base64,UklGRsqMCA...TRUNCATED_FOR_TOOL_CALL..."
        alt="Mundo Vivo approved landing page"
        draggable="false"
      >
      <a class="real-logo" href="#top" aria-label="Mundo Vivo home">
        <img src="data:image/webp;base64,UklGRvoBAQ...TRUNCATED_FOR_TOOL_CALL..." alt="Mundo Vivo — Worlds Beyond Imagination">
      </a>
      <nav class="top-hotspots" aria-label="Primary navigation">
        <a class="nav-vision" href="#vision">Our Vision</a>
        <a class="nav-experience" href="#experience">The Experience</a>
        <a class="nav-care" href="#care">Care &amp; Guidance</a>
        <a class="nav-tech" href="#technology">Technology</a>
        <a class="nav-community" href="#community">Community</a>
        <a class="nav-partners" href="#partners">Partners</a>
        <a class="nav-join" href="#launch">Join the List</a>
      </nav>
      <form class="launch-overlay" id="launch" novalidate>
        <label class="sr-only" for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="Enter your email address" required>
        <button type="submit">JOIN THE LAUNCH LIST →</button>
      </form>
      <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
      <a id="experience" class="hotspot care-experience" href="#care" aria-label="The Care Experience"></a>
      <a id="technology" class="hotspot labs-approach" href="#technology" aria-label="See our approach"></a>
      <a id="care" class="hotspot standards-button" href="#care" aria-label="Our standards"></a>
      <a id="community" class="hotspot community-button" href="#community" aria-label="Join the community"></a>
      <a id="partners" class="hotspot supplier-button" href="mailto:hello@mundovivo.com.au?subject=Mundo%20Vivo%20Supplier%20Enquiry" aria-label="Supplier enquiry"></a>
      <a class="footer-contact" href="mailto:hello@mundovivo.com.au">Contact</a>
      <a class="footer-privacy" href="#privacy">Privacy</a>
      <a class="footer-follow" href="#community">Follow the Journey</a>
      <div id="vision" class="anchor vision-anchor" aria-hidden="true"></div>
      <div class="mundo-cursor" id="mundoCursor" aria-hidden="true">
        <img src="data:image/webp;base64,UklGRiYhAQ...TRUNCATED_FOR_TOOL_CALL..." alt="">
        <i class="bubble bubble-1"></i>
        <i class="bubble bubble-2"></i>
        <i class="bubble bubble-3"></i>
      </div>
      <button class="motion-toggle" id="motionToggle" type="button" aria-pressed="true" aria-label="Turn fish animation off">Motion ON</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
