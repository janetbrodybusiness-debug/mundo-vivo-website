<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#00192d">
<title>Mundo Vivo — Worlds Beyond Imagination</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth;background:#001522}body{margin:0;background:#001522;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}.page{position:relative;width:min(100vw,1100px);margin:0 auto;line-height:0;background:#001522}.reference{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}.nav-link,.hotspot,.footer-link{position:absolute;z-index:20;text-indent:-9999px;overflow:hidden;background:transparent}.nav-vision{left:24.9%;top:1.3%;width:6.8%;height:2%}.nav-experience{left:32.7%;top:1.3%;width:10%;height:2%}.nav-care{left:43.2%;top:1.3%;width:9.7%;height:2%}.nav-tech{left:53.8%;top:1.3%;width:8%;height:2%}.nav-community{left:62.3%;top:1.3%;width:8.5%;height:2%}.nav-partners{left:71.1%;top:1.3%;width:7.5%;height:2%}.nav-join{left:79%;top:.7%;width:14%;height:3%;border-radius:999px}.launch-form{position:absolute;z-index:25;left:4.9%;top:19.18%;width:41.5%;height:2.25%;display:flex;opacity:.01;border-radius:999px;overflow:hidden}.launch-form:focus-within{opacity:1;background:white}.launch-form input{width:59%;border:0;padding:0 4%;outline:none;font-size:clamp(8px,.85vw,14px)}.launch-form button{width:41%;border:0;background:linear-gradient(90deg,#78ecff,#a18aff);font-weight:700;color:#09243b;font-size:clamp(7px,.8vw,12px);cursor:pointer}.status{position:absolute;left:5%;top:21.5%;z-index:30;font-size:11px;line-height:1.2;color:#c8fbff}.care-button{left:27%;top:42.1%;width:22%;height:2.5%}.labs-button{left:4.6%;top:54.2%;width:19%;height:2.5%}.standards-button{left:4.5%;top:66%;width:18%;height:2.5%}.community-button{left:46.3%;top:76.6%;width:21%;height:2.5%}.supplier-button{left:4.5%;top:88.5%;width:19%;height:2.5%}.footer-contact{left:58.5%;top:94.4%;width:5.3%;height:2%}.footer-privacy{left:64%;top:94.4%;width:5.3%;height:2%}.footer-follow{left:69.7%;top:94.4%;width:12%;height:2%}#mundiFollower{position:fixed;left:0;top:0;width:clamp(78px,7vw,120px);z-index:200;pointer-events:none;transform:translate3d(-200px,-200px,0);filter:drop-shadow(0 0 12px rgba(45,220,255,.45)) drop-shadow(0 0 22px rgba(166,62,255,.25));will-change:transform}#mundiFollower img{display:block;width:100%;height:auto}.motion-toggle{position:fixed;right:14px;bottom:14px;z-index:220;border:1px solid rgba(91,231,255,.35);background:rgba(0,18,34,.78);color:white;border-radius:999px;padding:8px 12px;font-size:11px;cursor:pointer;backdrop-filter:blur(8px)}body.motion-off #mundiFollower{display:none}@media (hover:none),(pointer:coarse),(prefers-reduced-motion:reduce){#mundiFollower,.motion-toggle{display:none}}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<main class="page" id="top">
<img class="reference" src="assets/landing.webp" alt="Mundo Vivo approved landing page">
<a class="nav-link nav-vision" href="#top">Our Vision</a><a class="nav-link nav-experience" href="#experience">The Experience</a><a class="nav-link nav-care" href="#care">Care & Guidance</a><a class="nav-link nav-tech" href="#technology">Technology</a><a class="nav-link nav-community" href="#community">Community</a><a class="nav-link nav-partners" href="#partners">Partners</a><a class="nav-link nav-join" href="#launch">Join the List</a>
<form class="launch-form" id="launch"><label class="sr-only" for="email">Email address</label><input id="email" name="email" type="email" placeholder="Enter your email address" required><button type="submit">JOIN THE LAUNCH LIST →</button></form><div class="status" id="status" role="status"></div>
<a id="experience" class="hotspot care-button" href="#care">Care Experience</a><a id="technology" class="hotspot labs-button" href="#technology">Mundo Labs</a><a id="care" class="hotspot standards-button" href="#care">Our Standards</a><a id="community" class="hotspot community-button" href="#community">Join Community</a><a id="partners" class="hotspot supplier-button" href="mailto:hello@mundovivo.com.au?subject=Mundo%20Vivo%20Supplier%20Enquiry">Supplier Enquiry</a><a class="footer-link footer-contact" href="mailto:hello@mundovivo.com.au">Contact</a><a class="footer-link footer-privacy" href="#privacy">Privacy</a><a class="footer-link footer-follow" href="#community">Follow the Journey</a>
</main>
<div id="mundiFollower" aria-hidden="true"><img src="assets/mundi.webp" alt=""></div><button class="motion-toggle" id="motionToggle" type="button" aria-pressed="true">Mundi Motion ON</button>
<script>
const form=document.getElementById('launch'),status=document.getElementById('status');form?.addEventListener('submit',e=>{e.preventDefault();const email=String(new FormData(form).get('email')||'').trim();if(!email.includes('@')){status.textContent='Please enter a valid email address.';return}status.textContent="You're on the launch list.";form.reset()});(()=>{const follower=document.getElementById('mundiFollower'),toggle=document.getElementById('motionToggle');if(!follower||!toggle)return;if(matchMedia('(hover:none),(pointer:coarse)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches)return;let enabled=localStorage.getItem('mundoMundiMotion')!=='off',tx=innerWidth*.7,ty=innerHeight*.35,x=tx,y=ty,raf=0;const sync=()=>{document.body.classList.toggle('motion-off',!enabled);toggle.setAttribute('aria-pressed',String(enabled));toggle.textContent=enabled?'Mundi Motion ON':'Mundi Motion OFF'};const animate=()=>{if(!enabled){raf=0;return}x+=(tx-x)*.105;y+=(ty-y)*.105;follower.style.transform=`translate3d(${x-follower.offsetWidth*.42}px,${y-follower.offsetHeight*.48}px,0)`;raf=requestAnimationFrame(animate)};addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;tx=Math.max(60,Math.min(innerWidth-60,e.clientX+44));ty=Math.max(50,Math.min(innerHeight-50,e.clientY+20));if(enabled&&!raf)raf=requestAnimationFrame(animate)},{passive:true});toggle.addEventListener('click',()=>{enabled=!enabled;localStorage.setItem('mundoMundiMotion',enabled?'on':'off');sync();if(enabled&&!raf)raf=requestAnimationFrame(animate)});sync();if(enabled)raf=requestAnimationFrame(animate)})();
</script>
</body>
</html>
